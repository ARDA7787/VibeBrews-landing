    <script>
        (function() {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const size = 32, radius = 10;
                canvas.width = size; canvas.height = size;
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(radius, 0); ctx.lineTo(size - radius, 0);
                ctx.quadraticCurveTo(size, 0, size, radius);
                ctx.lineTo(size, size - radius);
                ctx.quadraticCurveTo(size, size, size - radius, size);
                ctx.lineTo(radius, size);
                ctx.quadraticCurveTo(0, size, 0, size - radius);
                ctx.lineTo(0, radius);
                ctx.quadraticCurveTo(0, 0, radius, 0);
                ctx.closePath(); ctx.clip();
                ctx.drawImage(img, 0, 0, size, size);
                const favicon = document.getElementById('favicon');
                if (favicon) favicon.href = canvas.toDataURL('image/png');
            };
            img.src = 'assets/logo-white-96x96.png';
        })();

        const { useState, useEffect, useRef, useMemo } = React;

        // --- 3D Background Component ---
        const CinematicBackground = ({ scrollY }) => {
            const mountRef = useRef(null);
            
            useEffect(() => {
                if (!mountRef.current) return;
                
                // Scene Setup
                const scene = new THREE.Scene();
                scene.fog = new THREE.FogExp2(0x000000, 0.002);
                
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                mountRef.current.appendChild(renderer.domElement);

                // Objects: "Dead Code" Cubes
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const material = new THREE.MeshBasicMaterial({ color: 0x333333, wireframe: true, transparent: true, opacity: 0.3 });
                const cubes = [];
                
                for (let i = 0; i < 400; i++) {
                    const cube = new THREE.Mesh(geometry, material);
                    cube.position.x = (Math.random() - 0.5) * 100;
                    cube.position.y = (Math.random() - 0.5) * 100;
                    cube.position.z = (Math.random() - 0.5) * 100;
                    cube.rotation.x = Math.random() * Math.PI;
                    cube.rotation.y = Math.random() * Math.PI;
                    cube.userData = { 
                        speed: Math.random() * 0.02, 
                        axis: new THREE.Vector3(Math.random(), Math.random(), Math.random()).normalize() 
                    };
                    scene.add(cube);
                    cubes.push(cube);
                }

                // "New Life" Particles (appear later)
                const particlesGeo = new THREE.BufferGeometry();
                const particleCount = 2000;
                const posArray = new Float32Array(particleCount * 3);
                for(let i = 0; i < particleCount * 3; i++) {
                    posArray[i] = (Math.random() - 0.5) * 150;
                }
                particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
                const particlesMat = new THREE.PointsMaterial({ size: 0.1, color: 0xFF5C00, transparent: true, opacity: 0 });
                const particles = new THREE.Points(particlesGeo, particlesMat);
                scene.add(particles);

                camera.position.z = 50;

                // Animation Loop
                let frameId;
                const animate = () => {
                    frameId = requestAnimationFrame(animate);
                    
                    // Rotate cubes
                    cubes.forEach(cube => {
                        cube.rotation.x += cube.userData.speed;
                        cube.rotation.y += cube.userData.speed;
                    });

                    // Scroll Interaction
                    const scrollPercent = window.scrollY / (document.body.scrollHeight - window.innerHeight);
                    
                    // Camera Movement: Fly through the field
                    camera.position.z = 50 - (scrollPercent * 100);
                    camera.rotation.z = scrollPercent * Math.PI * 0.5;
                    
                    // Transition effects based on scroll
                    if (scrollPercent > 0.5) {
                        // Transition to "VibeBrews" colors
                        material.color.setHex(0x111111);
                        material.opacity = Math.max(0, 0.3 - (scrollPercent - 0.5) * 2); // Fade out cubes
                        particlesMat.opacity = Math.min(0.8, (scrollPercent - 0.5) * 3); // Fade in particles
                        scene.fog.color.setHex(0x050505);
                    } else {
                        material.color.setHex(0x333333);
                        material.opacity = 0.3;
                        particlesMat.opacity = 0;
                    }

                    renderer.render(scene, camera);
                };
                animate();

                // Resize Handler
                const handleResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    cancelAnimationFrame(frameId);
                    window.removeEventListener('resize', handleResize);
                    if (mountRef.current) mountRef.current.innerHTML = '';
                };
            }, []);

            return <div ref={mountRef} className="fixed inset-0 z-0 pointer-events-none" />;
        };

                    if (entry.isIntersecting) setIsVisible(true);
                }, { threshold: 0.2 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            return (
                <div ref={ref} className={`transition-all duration-1000 transform ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`} style={{ transitionDelay: `${delay}ms` }}>

                    {/* The Problem */}
                    <Section>
